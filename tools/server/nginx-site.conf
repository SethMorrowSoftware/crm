# Castle CRM — nginx server block for an Ubuntu/Debian server.
#
# install.sh writes a copy of this to /etc/nginx/sites-available/castle-crm
# with the placeholders filled in, and enables it. You can edit the installed
# copy freely; re-running install.sh does not overwrite it.
#
#   __CC_DOMAIN__        server_name, e.g. crm.thecastlefuncenter.com
#   __CC_PATH__          where the checkout lives, e.g. /var/www/castle-crm
#   __CC_PHP_VERSION__   the PHP-FPM pool, e.g. 8.3
#
# NGINX NEVER READS .htaccess. The whole request policy that ships with the
# application — the front controller, the deny rules, the security headers —
# is therefore restated here, and the application's own PHP guards
# (index.php's path check, the CLI guard at the top of every script under
# tests/ and tools/) are what stands behind it if a rule here is lost.
#
# tests/static/QualityGatesTest.php holds this file to the same deny list as
# the .htaccess, so the two cannot drift apart unnoticed.

server {
    listen 80;
    listen [::]:80;

    server_name __CC_DOMAIN__;
    root __CC_PATH__;

    index index.php;

    # Castle CRM accepts logo and import uploads; .htaccess asks PHP for 16M
    # files inside a 20M request, so nginx has to allow at least as much or it
    # rejects the upload before PHP ever sees it.
    client_max_body_size 20m;

    access_log /var/log/nginx/castle-crm-access.log;
    error_log  /var/log/nginx/castle-crm-error.log;

    # -----------------------------------------------------------------------
    # ACME first: everything else about dotted paths is a refusal, and
    # certificate renewal has to come before that rule, not after it.
    # -----------------------------------------------------------------------
    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        try_files $uri =404;
    }

    # -----------------------------------------------------------------------
    # Never serve application internals
    # -----------------------------------------------------------------------
    # `^~` so these win over the regex PHP handler below: without it, a
    # request for /tests/run.php would match `\.php$` and be EXECUTED — the
    # test runner, which boots against the live database.
    location ^~ /app/     { return 404; }
    location ^~ /config/  { return 404; }
    location ^~ /storage/ { return 404; }
    location ^~ /tests/   { return 404; }
    location ^~ /tools/   { return 404; }

    location ^~ /install/schema/ { return 404; }
    location ^~ /install/seeds/  { return 404; }
    location ^~ /install/steps/  { return 404; }

    # A dotted file OR a dotted directory: an install deployed by cloning has
    # .git in the web root, and /.git/config is the whole repository history.
    location ~ /\. { return 404; }

    # Data and documentation that happen to sit inside the web root.
    location ~* \.(sql|md|lock|log|ini|sh|bak|old|orig|swp|dist|ya?ml)$ { return 404; }
    location ~* \.sample\.php$ { return 404; }
    # The application serves no .json file; config and data dumps are the only
    # things with that extension anywhere in the tree.
    location ~* \.json$ { return 404; }

    # -----------------------------------------------------------------------
    # The installer's own mod_rewrite probe
    # -----------------------------------------------------------------------
    # Step 2 of the web installer fetches this to prove rewriting works. On
    # Apache the .htaccess maps it; here it has to be mapped by hand, or the
    # requirements page reports "could not confirm" on a server where
    # rewriting is in fact fine.
    # A rewrite rather than a fastcgi_pass of its own: `try_files` in a
    # location that also passes to PHP will happily serve a .php file as
    # plain text when the file exists, which would publish source instead of
    # running it. `last` hands the rewritten path back to location matching,
    # so it arrives at the PHP handler below like any other request.
    location = /__rewrite_probe {
        rewrite ^ /install/probe.php last;
    }

    # -----------------------------------------------------------------------
    # Static assets, cache-busted by ?v=VERSION
    # -----------------------------------------------------------------------
    # `expires` and NOT `add_header Cache-Control`: an add_header anywhere in
    # a location replaces the whole inherited set, so adding one here would
    # silently drop nosniff and the frame policy from every stylesheet and
    # script — the files where a sniffed content type does the most damage.
    # `expires` sets Cache-Control by itself and inherits the rest.
    location ~* ^/assets/.+\.(css|js|svg|png|jpe?g|webp|woff2?)$ {
        expires 1y;
        try_files $uri =404;
    }

    # -----------------------------------------------------------------------
    # The front controller
    # -----------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php__CC_PHP_VERSION__-fpm.sock;
        fastcgi_read_timeout 180;
    }

    # -----------------------------------------------------------------------
    # Security headers
    # -----------------------------------------------------------------------
    # The ones that do not depend on request state. The rest — HSTS, the CSP —
    # are emitted by PHP, which knows whether HTTPS is actually working; see
    # app/bootstrap.php.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    server_tokens off;

    error_page 404 /index.php;
}
