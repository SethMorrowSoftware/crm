# Castle CRM — Apache virtual host for an Ubuntu/Debian server.
#
# install.sh writes a copy of this to /etc/apache2/sites-available/ with the
# three __CC_*__ placeholders filled in, and enables it. You can edit the
# installed copy freely; re-running install.sh does not overwrite it.
#
#   __CC_DOMAIN__   ServerName, e.g. crm.thecastlefuncenter.com
#   __CC_PATH__     where the checkout lives, e.g. /var/www/castle-crm
#   __CC_PHP_FPM__  on a server shared with other sites, the lines that send
#                   .php to Castle CRM's own PHP-FPM pool instead of mod_php;
#                   on a dedicated server, nothing. Copying this by hand:
#                   delete the line, or put in a SetHandler for your pool.
#
# The real request policy is the shipped .htaccess in __CC_PATH__: the front
# controller rewrite, the security headers, the asset caching, the deny rules.
# That is deliberate — it ships with the application, so `git pull` updates it,
# and one file governs both this server and the cPanel install the application
# was first written for. `AllowOverride All` below is what lets Apache read it.
#
# The deny rules are then repeated here, because `AllowOverride` is exactly the
# setting somebody tightens months later for performance, and the two things
# that must not depend on anybody remembering why are the paths that would
# publish the application's own source and the repository it was cloned from.

<VirtualHost *:80>
    ServerName __CC_DOMAIN__

    DocumentRoot __CC_PATH__

    <Directory __CC_PATH__>
        Options -Indexes +FollowSymLinks
        # The shipped .htaccess is the policy. See the note above.
        AllowOverride All
        Require all granted
    </Directory>

    __CC_PHP_FPM__

    # ---------------------------------------------------------------------
    # Never serve application internals, whatever AllowOverride says
    # ---------------------------------------------------------------------
    # tests/ and tools/ are the dangerous two: both hold scripts that boot
    # against the configured database, and Apache serves a REAL FILE without
    # consulting the rewrite rules. Each of those scripts refuses to run
    # outside a terminal as well — three layers, because this one is a
    # one-line edit away from being gone.
    RedirectMatch 404 (?i)^/(app|config|storage|tests|tools|install/(schema|seeds|steps))/
    RedirectMatch 404 (?i)\.(sql|md|json|lock|log|sample\.php)$

    # A DOTTED DIRECTORY, not just a dotted file: an install deployed by
    # cloning has a .git directory in the web root, and GET /.git/config
    # would otherwise publish the whole repository history. .well-known is
    # exempt so certbot can answer an ACME challenge and TLS keeps renewing.
    RedirectMatch 404 (?i)(^|/)\.(?!well-known/)

    # ---------------------------------------------------------------------
    # Logs
    # ---------------------------------------------------------------------
    ErrorLog ${APACHE_LOG_DIR}/castle-crm-error.log
    CustomLog ${APACHE_LOG_DIR}/castle-crm-access.log combined
</VirtualHost>
