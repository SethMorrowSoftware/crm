; Castle CRM — PHP settings for the web SAPI on an Ubuntu/Debian server.
;
; install.sh installs this as 99-castle-crm.ini in the conf.d of the SAPI it
; configured (apache2/ or fpm/), where the 99 makes it load last and win.
;
; These are the same values the shipped .htaccess asks mod_php for. They live
; here as well because .htaccess `php_value` only works under mod_php: under
; PHP-FPM those lines are ignored silently, and an import of a 4 MB guest
; export would fail with a message about the file being empty.

; An import or a logo upload. post_max_size must exceed upload_max_filesize,
; or the whole request is rejected and $_FILES arrives empty.
upload_max_filesize = 16M
post_max_size = 20M

; A CenterEdge import of a few thousand guests, or a segment rebuild, against
; the default 30 seconds. cron.php manages its own budget and is not affected.
max_execution_time = 120

; Headroom for a report over a year of visits. The application streams CSV
; exports rather than building them in memory, so this is not a working set.
memory_limit = 256M

; Errors go to the log, never to the page: an error on a page a guest can see
; (a booking form, a waiver) would otherwise print a file path and a query.
; app/bootstrap.php sets the same pair from config/config.php; this is what
; covers anything that fails before the bootstrap gets that far.
display_errors = Off
log_errors = On

; Stops the X-Powered-By header naming the exact PHP version to anybody who
; asks for a page.
expose_php = Off
