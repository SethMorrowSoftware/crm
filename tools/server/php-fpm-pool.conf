; Castle CRM — its own PHP-FPM pool.
;
; install.sh installs this as /etc/php/<version>/fpm/pool.d/castle-crm.conf
; whenever PHP runs under FPM: always behind nginx, and behind Apache on a
; server shared with other sites. A pool of its own means the settings below
; apply to Castle CRM alone, rather than to every PHP site on the machine the
; way a conf.d file would, and its workers cannot starve another site's.
;
; You can edit the installed copy freely; re-running install.sh does not
; overwrite it (--force-config does).
;
;   __CC_USER__         the web server's user, www-data on Ubuntu/Debian
;   __CC_FPM_SOCKET__   /run/php/castle-crm.sock

[castle-crm]
user = __CC_USER__
group = __CC_USER__

listen = __CC_FPM_SOCKET__
listen.owner = __CC_USER__
listen.group = __CC_USER__
listen.mode = 0660

; Workers start on demand and go away when idle: a CRM used by front-desk
; staff is quiet most of the day, and a shared server needs the memory back.
pm = ondemand
pm.max_children = 8
pm.process_idle_timeout = 60s
pm.max_requests = 500

; The values php-castle-crm.ini sets on a dedicated server, and for the same
; reasons (see that file).
php_admin_value[upload_max_filesize] = 16M
php_admin_value[post_max_size] = 20M
php_admin_value[max_execution_time] = 120
php_admin_value[memory_limit] = 256M
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
