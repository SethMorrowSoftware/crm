name: CI

# Castle CRM has zero Composer dependencies by design, so CI needs nothing but
# PHP and a database. That keeps the pipeline fast and makes it mirror the
# shared host the application actually runs on.

on:
  # Only the long-lived branches on push. Feature branches are covered by
  # their pull request, so this avoids running the whole matrix twice for
  # every commit on a PR branch.
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push supersedes an in-flight run on the same ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # Fast feedback: syntax and the checks that need no services at all.
  # Runs first so an obvious mistake fails in seconds rather than minutes.
  # ---------------------------------------------------------------------
  lint:
    name: Lint & static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, json, openssl, curl, fileinfo
          coverage: none
          tools: none

      - name: Check PHP syntax on every file
        run: |
          # -l one file at a time: the aggregate exit code is what matters, and
          # a parse error names the file.
          failed=0
          while IFS= read -r -d '' file; do
            if ! php -l "$file" > /dev/null 2>&1; then
              echo "::error file=${file}::PHP syntax error"
              php -l "$file" || true
              failed=1
            fi
          done < <(find . -name '*.php' -not -path './vendor/*' -not -path './.git/*' -print0)
          exit $failed

      - name: Check JavaScript syntax
        run: |
          failed=0
          for file in assets/js/*.js; do
            if ! node --check "$file"; then
              echo "::error file=${file}::JavaScript syntax error"
              failed=1
            fi
          done
          exit $failed

      - name: Check shell syntax
        # install.sh is how the application gets onto an Ubuntu server, and a
        # typo in it is not something the PHP suite can see. shellcheck is
        # pre-installed on the runner; -S warning skips the two information
        # notices about single-quoted PHP passed to `php -r`.
        run: |
          failed=0
          for file in install.sh tools/*.sh; do
            bash -n "$file" || failed=1
          done
          shellcheck -S warning install.sh tools/*.sh || failed=1
          exit $failed

      - name: Unit and static suites
        # --min-tests guards against a green run that tested nothing.
        run: php tests/run.php --unit --min-tests=670 --junit=tests/junit-unit.xml

      - name: Upload unit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-unit
          path: tests/junit-unit.xml
          if-no-files-found: ignore

  # ---------------------------------------------------------------------
  # The full suite against every PHP version the spec claims to support,
  # on both MySQL and MariaDB — the two things a cPanel host will offer.
  # ---------------------------------------------------------------------
  test:
    name: PHP ${{ matrix.php }} · ${{ matrix.database }}
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      # One failing combination should not hide the others.
      fail-fast: false
      matrix:
        # 8.5 because Ubuntu 26.04 ships it, and install.sh uses the release's PHP.
        php: ['8.1', '8.2', '8.3', '8.5']
        database: ['mysql:8.0']
        include:
          # MariaDB is what most cPanel hosts actually run, so it is covered on
          # the version the venue is most likely to have.
          - php: '8.3'
            database: 'mariadb:10.11'
          # The oldest combination the spec claims support for.
          - php: '8.1'
            database: 'mysql:5.7'

    services:
      database:
        image: ${{ matrix.database }}
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: castle_crm_test
          MARIADB_ROOT_PASSWORD: ci-root-password
          MARIADB_DATABASE: castle_crm_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
          --health-start-period=30s

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # Exactly the extensions the installer hard-requires, so CI proves
          # the application runs on the minimum it asks for.
          extensions: pdo_mysql, mbstring, json, openssl, curl, fileinfo
          coverage: none
          tools: none
          ini-values: error_reporting=E_ALL, display_errors=On

      - name: Wait for the database
        run: |
          for attempt in $(seq 1 40); do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -pci-root-password --silent 2>/dev/null; then
              echo "Database is up after ${attempt} attempt(s)."
              mysql -h 127.0.0.1 -uroot -pci-root-password -e 'SELECT VERSION();'
              exit 0
            fi
            sleep 3
          done
          echo "::error::The database never became ready."
          exit 1

      - name: Prepare storage directories
        run: |
          mkdir -p storage/{logs,cache,uploads,exports,backups,sessions}
          chmod -R 0775 storage

      - name: Run the full test suite
        env:
          CC_TEST_DB_HOST: 127.0.0.1
          CC_TEST_DB_PORT: '3306'
          CC_TEST_DB_NAME: castle_crm_test
          CC_TEST_DB_USER: root
          CC_TEST_DB_PASS: ci-root-password
        # --require-db and --require-http turn a skipped suite into a failure:
        # CI reporting success because nothing ran is worse than CI failing.
        run: |
          php tests/run.php \
            --require-db \
            --require-http \
            --min-tests=1720 \
            --junit=tests/junit.xml

      - name: Show the application log on failure
        if: failure()
        run: |
          # The whole application log, not a tail of it. A 120-line tail ended
          # before the http suites had even run, so a red reset-password suite
          # showed no entry explaining itself and the cause had to be found by
          # reproducing CI's environment locally instead of by reading this.
          echo "── application log ──"
          cat storage/logs/castle-*.log 2>/dev/null || echo "(no application log)"
          # The server log is mostly Accepted/Closing pairs, so keep only the
          # request lines — those carry the status code of every POST, which is
          # how a 429 from the rate limiter becomes visible at all.
          echo "── test server requests ──"
          grep -hE '\[[0-9]{3}\]:' storage/logs/test-server.log 2>/dev/null \
            | tail -n 200 || echo "(no server request lines)"
          echo "── test server log (tail) ──"
          tail -n 40 storage/logs/test-server.log 2>/dev/null || echo "(no server log)"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-php${{ matrix.php }}-${{ strategy.job-index }}
          path: tests/junit.xml
          if-no-files-found: ignore

  # ---------------------------------------------------------------------
  # Prove the two things the product promises about getting installed: that
  # it installs on a bare shared host through the web installer with no shell
  # access, and that it installs on a server from a clone and one command.
  # ---------------------------------------------------------------------
  install:
    name: Installers end-to-end
    runs-on: ubuntu-latest
    needs: lint

    services:
      database:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: castle_install_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
          --health-start-period=30s

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, json, openssl, curl, fileinfo
          coverage: none
          tools: none

      - name: Wait for the database
        run: |
          for attempt in $(seq 1 40); do
            if mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password --silent 2>/dev/null; then
              exit 0
            fi
            sleep 3
          done
          exit 1

      - name: Create an unprivileged database user, as cPanel would
        run: |
          mysql -h 127.0.0.1 -uroot -pci-root-password <<'SQL'
          CREATE USER 'castle_ci'@'%' IDENTIFIED BY 'castle-ci-password';
          GRANT ALL PRIVILEGES ON castle_install_test.* TO 'castle_ci'@'%';
          FLUSH PRIVILEGES;
          SQL

      - name: Prepare storage directories
        run: |
          mkdir -p storage/{logs,cache,uploads,exports,backups,sessions}
          chmod -R 0775 storage

      - name: Walk the installer
        env:
          CC_INSTALL_DB_HOST: 127.0.0.1
          CC_INSTALL_DB_NAME: castle_install_test
          CC_INSTALL_DB_USER: castle_ci
          CC_INSTALL_DB_PASS: castle-ci-password
        run: php tests/install/walk-installer.php

      - name: Install the same thing headlessly
        # What install.sh does on an Ubuntu server once the packages are in
        # place: tools/cli-install.php, through the engine the web installer
        # shares with it. Run after the walk, from the same empty database —
        # the script drops every table itself.
        env:
          CC_INSTALL_DB_HOST: 127.0.0.1
          CC_INSTALL_DB_NAME: castle_install_test
          CC_INSTALL_DB_USER: castle_ci
          CC_INSTALL_DB_PASS: castle-ci-password
        run: php tests/install/cli-install.php

      - name: Show logs on failure
        if: failure()
        run: tail -n 120 storage/logs/*.log 2>/dev/null || true

  # ---------------------------------------------------------------------
  # The other install route: a bare Ubuntu server, `git clone`, install.sh.
  # A fresh container per release, so nothing the runner image already has
  # installed can hide a package the script forgot.
  # ---------------------------------------------------------------------
  ubuntu-install:
    name: install.sh · Ubuntu ${{ matrix.ubuntu }} · ${{ matrix.web }}
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        # 26.04 is the first release on PHP 8.5, which the ondrej/php PPA
        # does not publish: the release a fixed version list once failed on.
        ubuntu: ['22.04', '24.04', '26.04']
        web: ['apache']
        include:
          - ubuntu: '24.04'
            web: 'nginx'

    steps:
      - uses: actions/checkout@v4

      - name: Lint the smoke test
        run: shellcheck -S warning tests/install/ubuntu-smoke.sh

      - name: Clone, run install.sh, then check the result
        run: |
          docker run --rm -v "$PWD:/src:ro" -e WEB="${{ matrix.web }}" "ubuntu:${{ matrix.ubuntu }}" bash -euo pipefail -c '
            apt-get update -q >/dev/null
            apt-get install -y -q --no-install-recommends git ca-certificates curl >/dev/null
            # /src belongs to the runner user, not root.
            git config --global --add safe.directory "*"
            # Exactly what the README tells a person to do.
            git clone -q /src /var/www/castle-crm
            cd /var/www/castle-crm
            install -d -m 0700 /root/secrets
            echo "smoke-test passphrase 2026" > /root/secrets/owner
            ./install.sh --yes --domain localhost --web-server "$WEB" \
              --admin-email owner@castle.test --admin-name "Smoke Owner" \
              --admin-password-file /root/secrets/owner --venue-name "Smoke Test Venue"
            # A second run is the repair path and must change nothing that matters.
            ./install.sh --yes --domain localhost --web-server "$WEB" > /dev/null
            tests/install/ubuntu-smoke.sh http://localhost /var/www/castle-crm
            test -z "$(git status --porcelain --untracked-files=no)"
          '

  # ---------------------------------------------------------------------
  # The same, on a server that already runs other sites: install.sh must
  # use the web server that is there, add one site under its own name, run
  # PHP in its own pool, and leave the other sites and the default site, the
  # MPM and the database server exactly as it found them.
  # ---------------------------------------------------------------------
  ubuntu-install-shared:
    name: install.sh · shared server · ${{ matrix.web }} · ${{ matrix.mode }} · Ubuntu ${{ matrix.ubuntu }}
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['24.04', '26.04']
        web: ['nginx', 'apache']
        # Under a hostname on port 80 beside the others, or on a port of its
        # own with no hostname at all.
        mode: ['domain']
        include:
          - { ubuntu: '26.04', web: 'nginx',  mode: 'port' }
          - { ubuntu: '26.04', web: 'apache', mode: 'port' }

    steps:
      - uses: actions/checkout@v4

      - name: Another application first, then Castle CRM beside it
        run: |
          docker run --rm -v "$PWD:/src:ro" -e WEB="${{ matrix.web }}" -e MODE="${{ matrix.mode }}" "ubuntu:${{ matrix.ubuntu }}" bash -euo pipefail -c '
            apt-get update -q >/dev/null
            apt-get install -y -q --no-install-recommends git ca-certificates curl iproute2 >/dev/null
            echo "127.0.0.1 crm.test other.test" >> /etc/hosts
            if [ "$MODE" = port ]; then
              WHERE="--port 8088"; URL="http://127.0.0.1:8088"
            else
              WHERE="--domain crm.test"; URL="http://crm.test"
            fi

            # The application that was here first: a plain site on its own name.
            mkdir -p /var/www/other && echo "OTHER APP" > /var/www/other/index.html
            if [ "$WEB" = nginx ]; then
              apt-get install -y -q --no-install-recommends nginx >/dev/null
              sed -i "s/listen \[::\]:80 default_server;/# &/" /etc/nginx/sites-available/default
              printf "server { listen 80; server_name other.test; root /var/www/other; }\n" > /etc/nginx/sites-available/other
              ln -s ../sites-available/other /etc/nginx/sites-enabled/other
              service nginx start
            else
              apt-get install -y -q --no-install-recommends apache2 >/dev/null
              printf "<VirtualHost *:80>\n ServerName other.test\n DocumentRoot /var/www/other\n</VirtualHost>\n" > /etc/apache2/sites-available/other.conf
              a2ensite -q other
              service apache2 start
            fi
            test "$(curl -s http://other.test/)" = "OTHER APP"
            mpm_before=$( { apache2ctl -M 2>/dev/null || true; } | grep -o "mpm_[a-z]*" || true)

            git config --global --add safe.directory "*"
            git clone -q /src /var/www/castle-crm
            cd /var/www/castle-crm
            install -d -m 0700 /root/secrets
            echo "smoke-test passphrase 2026" > /root/secrets/owner

            # Without a hostname of its own it must refuse, having changed nothing.
            if ./install.sh --yes --admin-email owner@castle.test --admin-password-file /root/secrets/owner > /tmp/refusal 2>&1; then
              echo "install.sh accepted a shared server without --domain"; exit 1
            fi
            grep -q "hostname of its own" /tmp/refusal

            # No --web-server: it has to find the one already on port 80.
            # shellcheck disable=SC2086
            ./install.sh --yes $WHERE \
              --admin-email owner@castle.test --admin-name "Smoke Owner" \
              --admin-password-file /root/secrets/owner --venue-name "Smoke Test Venue"
            # shellcheck disable=SC2086
            ./install.sh --yes $WHERE > /dev/null

            # A kept site file answers on its old port, so a new port without
            # --force-config must be refused rather than half applied.
            if [ "$MODE" = port ]; then
              if ./install.sh --yes --port 8089 > /tmp/refusal 2>&1; then
                echo "install.sh moved to a new port while keeping the old site file"; exit 1
              fi
              grep -q "already set up on a different port" /tmp/refusal
            fi

            tests/install/ubuntu-smoke.sh "$URL" /var/www/castle-crm

            # Everything that was here is as it was.
            test "$(curl -s http://other.test/)" = "OTHER APP"
            if [ "$WEB" = nginx ]; then
              test -e /etc/nginx/sites-enabled/default
              if command -v apache2 > /dev/null; then echo "apache2 was installed beside nginx"; exit 1; fi
            else
              test -e /etc/apache2/sites-enabled/000-default.conf
              test ! -e /etc/apache2/conf-enabled/zz-castle-crm.conf
              test "$(apache2ctl -M 2>/dev/null | grep -o "mpm_[a-z]*")" = "$mpm_before"
              if apache2ctl -M 2>/dev/null | grep -q php; then echo "mod_php was enabled on a shared Apache"; exit 1; fi
              if command -v nginx > /dev/null; then echo "nginx was installed beside Apache"; exit 1; fi
            fi
            test ! -e /etc/php/*/apache2/conf.d/99-castle-crm.ini
            test ! -e /etc/php/*/fpm/conf.d/99-castle-crm.ini
            test -S /run/php/castle-crm.sock
            test -z "$(git status --porcelain --untracked-files=no)"
            echo "Castle CRM installed beside another site, and the other site is untouched."
          '
